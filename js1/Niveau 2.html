        </main>
        <script>
            const celsius=document.getElementById("conv1");
            let f="";
            let c="";
            celsius.addEventListener("click",function(){
                 const temp=document.getElementById("temp").value;
                if(isNaN(temp)){
                    alert("vous n'avez pas entrer un nombre");
                }
                else{
                     f=(temp*9/5)+32;
                }
                document.getElementById("lab");
                lab.textContent="le resultat est: "+f+"F";
                });
                const conv2=document.getElementById("conv2");
                conv2.addEventListener("click",function(){
                    const temp=document.getElementById("temp").value;
                    if(isNaN(temp)){
                        alert("vous n'avez pas saisie de nombre");
                    }
                    else{
                        C=(temp-32)*5/9;
                    }
                   const lab= document.getElementById("lab");
                    lab.textContent="le resultat est: "+C+"C";
                });
        </script>
